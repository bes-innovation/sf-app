name: Deploy to Production on Merge

on:
  push:
    branches: [main]
    paths: ['force-app/**']

jobs:
  deploy:
    permissions:
      contents: read
      pull-requests: read
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-sf-deploy-wfl.yml@v1
    with:
      environment: prod
      target-org: prod
      # Same reason as the prod PR gate: RunLocalTests runs the org's 20 stock
      # Communities/Sites sample classes, which fail on INSUFFICIENT_ACCESS and
      # cannot be fixed from this repo.
      test-level: RunRelevantTests
      # Quick deploy is OFF as a consequence, not by preference. It requires a
      # validation that actually executed tests, and RunRelevantTests against a
      # repo with zero Apex resolves to zero tests -- the quick deploy is then
      # rejected with CannotQuickDeployError. Restoring the agreed
      # RunLocalTests + quick-deploy design needs the sample classes cleared
      # from the org first; it is not a pipeline change.
      use-quick-deploy: false
    secrets: inherit

  # Same release the UAT cycle validated -- just drops the pre-release flag
  # so it reads as the version actually live in prod, no new tag.
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          commitish: main
          publish: true
          prerelease: false
          # Without this, a prod publish reaches across and consumes the draft
          # accumulating on develop. release-drafter keeps ONE draft per repo
          # and uses it to decide "update the existing release or create a new
          # one", so the develop draft gets retargeted to main, its body
          # recomputed against main's history, and published as this release.
          #
          # That happened on the v0.1.2 hotfix: the published notes were right
          # (only the hotfix is in prod) but the draft holding #34/#35/#36 was
          # the object it published, and since release-drafter scopes by
          # timestamp, those PRs fell behind the new baseline and can never
          # appear in a generated changelog again.
          #
          # The filter is applied to every release BEFORE drafts and published
          # are split (find-previous-releases.ts), so it hides the develop
          # draft from a main publish rather than only affecting the baseline.
          #
          # Safe here specifically because every final release targets main.
          # Do NOT copy this to the develop draft job -- no published release
          # targets develop, so lastRelease would be undefined there and the
          # changelog range would blow out to the repo's full history.
          filter-by-commitish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # main now has everything the release/* branch had, including any
  # stabilization fixes made only during UAT -- without this, those fixes
  # stay stuck in prod and reappear as "new" bugs in the next release cut.
  # Which branch this merge came from decides whether a backpromotion is
  # needed at all. A push carries no such information, so it has to be looked
  # up from the PR associated with the merge commit.
  detect-source:
    runs-on: ubuntu-latest
    outputs:
      head-ref: ${{ steps.pr.outputs.head-ref }}
    steps:
      - name: Look up the merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_REF=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].head.ref // empty')
          echo "Merge into main came from: ${HEAD_REF:-<no associated PR>}"
          echo "head-ref=$HEAD_REF" >> "$GITHUB_OUTPUT"

  # Skipped for release/** promotions: deploy-release.yml already backpromotes
  # each stabilization fix into develop as it lands, so by the time the release
  # reaches main there is nothing left to carry -- only merge commits, which
  # produced a PR with no real content every cycle.
  #
  # Everything else that reaches main exists ONLY on main -- hotfixes above all
  # -- and must go back, or the next release cut reverts it in production.
  #
  # A direct push with no associated PR resolves to an empty head-ref, which
  # does not match the prefix, so it backpromotes. That is the safe default:
  # code on main and nowhere else.
  backpromote:
    needs: [deploy, detect-source]
    if: ${{ !startsWith(needs.detect-source.outputs.head-ref, 'release/') }}
    permissions:
      contents: write
      pull-requests: write
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-backpromote-wfl.yml@v1
