name: Deploy to Production on Merge

on:
  push:
    branches: [main]
    paths: ['force-app/**']

jobs:
  deploy:
    permissions:
      contents: read
      pull-requests: read
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-sf-deploy-wfl.yml@v1
    with:
      environment: prod
      target-org: prod
      use-quick-deploy: true
    secrets: inherit

  # Same release the UAT cycle validated -- just drops the pre-release flag
  # so it reads as the version actually live in prod, no new tag.
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          commitish: main
          publish: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
