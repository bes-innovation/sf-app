# Reports as `ci-devops / uat / validate` -- see pr-validation-integration.yml
# for why the caller job is named for its environment rather than `validate`.
name: ci-devops

# Stabilization fixes during UAT validation go through a small PR against
# the release/* branch itself (e.g. fix/xyz -> release/1.4.0), not a raw
# push -- this is what validates each of those fixes before they redeploy.

on:
  pull_request:
    branches: ['release/**']
    paths: ['force-app/**']

jobs:
  uat:
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-sf-validate-wfl.yml@v1
    with:
      environment: uat
      target-org: uat
      severity-threshold: "5"
      # The reusable workflow defaults to RunLocalTests, which means "every test
      # in the org" -- including the 20 stock Communities/Sites sample classes
      # the org ships pre-installed and Active. They fail on INSUFFICIENT_ACCESS
      # because Communities was never configured, and none of that code is in
      # this repo, so no repo change can make them pass.
      #
      # Fourth workflow to hit this: integration (#13), the UAT deploy (#19),
      # prod (#27), and now the UAT PR gate. This was the last one left.
      test-level: RunRelevantTests
    secrets: inherit
