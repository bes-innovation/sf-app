name: Cut Release

# Manual trigger to open a new release/<version> branch from develop. That
# branch creation is what fires "Deploy Release Candidate to UAT"
# (deploy-release.yml's push trigger) -- this workflow only creates the
# branch. Run it from the Actions tab; leave "version" blank to use
# release-drafter's next resolved version off the running develop draft.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut, e.g. 1.4.0 (blank = auto-resolve from release-drafter)"
        required: false

jobs:
  cut-release:
    permissions:
      contents: write
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-cut-release-wfl.yml@v1
    with:
      version: ${{ inputs.version }}
      # Turns the draft that accumulated on develop during the development
      # window into the pre-release for this cycle, pinned to the branch just
      # cut. Without this the cut creates the branch and leaves the draft a
      # draft: deploy-release.yml's publish-release-candidate would normally
      # publish it, but that job never runs, because the branch is created with
      # GITHUB_TOKEN and GitHub will not fire a workflow from a ref created by
      # that token.
      publish-prerelease: true
    secrets: inherit
