# Reports as `ci-devops / prod / validate` -- see pr-validation-integration.yml
# for why the caller job is named for its environment rather than `validate`.
name: ci-devops

on:
  pull_request:
    branches: [main]
    paths: ['force-app/**']

jobs:
  prod:
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-sf-validate-wfl.yml@v1
    with:
      environment: prod
      target-org: prod
      severity-threshold: "5"
    secrets: inherit
