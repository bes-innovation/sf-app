name: Deploy Release Candidate to UAT

# Fires on push to any release/* branch -- the branch itself IS the release
# candidate, not a merge into a fixed staging branch. Creating release/x.y.z
# from develop is the "cut"; every subsequent push (a PR-merged stabilization
# fix) redeploys the same candidate to UAT.
#
# No `paths` filter here on purpose: cutting a release branch is usually a
# pure ref creation with zero new commits over develop, so there's no diff
# for a path filter to match against -- GitHub silently skips the whole
# trigger in that case, not just the path-gated part. The cut itself must
# always deploy, diff or not.

on:
  push:
    branches: ['release/**']

jobs:
  deploy:
    permissions:
      contents: read
      pull-requests: read
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-sf-deploy-wfl.yml@v1
    with:
      environment: uat
      target-org: uat
      # The reusable workflow defaults to RunLocalTests, which means "every
      # test in the org" -- including the 20 stock Communities/Sites sample
      # classes the org ships pre-installed and Active. Those fail with
      # INSUFFICIENT_ACCESS because Communities was never configured, and none
      # of that code is in this repo. Same trap that broke the Integration
      # deploy in PR #13; scope to the deployed metadata instead.
      test-level: RunRelevantTests
    secrets: inherit

  # Publishes the next numbered candidate for this cycle. The cut opens rc.0;
  # every stabilization fix merged into the release branch lands the next one.
  #
  # Numbering rather than mutating is what makes this work at all:
  # release-drafter only ever writes to drafts, so once a candidate is
  # published it is beyond reach -- but publishing the next rc is trivial.
  publish-release-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # github-tag-action runs in a Docker container and shells out to git in
      # the workspace to read existing tags. Without a checkout the workspace
      # is empty and it dies on "fatal: not a git repository" before doing any
      # version math at all. fetch-depth: 0 because a shallow clone carries no
      # tags, which would leave it computing from INITIAL_VERSION instead of
      # from what the repo actually has.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The base version comes from the branch name, never from tag inference.
      #
      # github-tag-action cannot do this itself. Its prerelease path only
      # increments an existing rc counter when the base it derived from the
      # latest NON-prerelease tag matches that candidate's base:
      #
      #   if [[ "$pre_tag" =~ $new ]] && [[ "$pre_tag" =~ $suffix ]]
      #
      # Since $new is bump(last released tag), that test fails in both real
      # situations. With v0.1.0 released it derived 0.1.1 and published
      # v0.1.1-rc.0; with no released tag at all it fell back to
      # INITIAL_VERSION and published v0.0.1-rc.0. Both moved the base off the
      # branch the candidate belongs to.
      #
      # Counting our own rc tags is immune to all of it: unrelated tags are
      # filtered out by the pattern, so a second live release branch or a
      # stray tag cannot perturb this one.
      - name: Resolve the next candidate for this release branch
        id: rc
        run: |
          BASE="${GITHUB_REF_NAME#release/}"
          BASE="${BASE#v}"

          LAST=$(git tag --list "v${BASE}-rc.*" \
            | sed "s#^v${BASE}-rc\.##" \
            | grep -E '^[0-9]+$' \
            | sort -n | tail -1)

          NEXT=$(( ${LAST:--1} + 1 ))
          TAG="v${BASE}-rc.${NEXT}"

          echo "Release branch $GITHUB_REF_NAME -> base $BASE, previous rc ${LAST:-<none>}, next $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Kept as the tagger only. CUSTOM_TAG short-circuits every semver
      # calculation it would otherwise do -- the value resolved above is what
      # gets tagged.
      - name: Push the candidate tag
        id: semantic
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: false
          PRERELEASE: true
          PRERELEASE_SUFFIX: rc
          RELEASE_BRANCHES: main
          CUSTOM_TAG: ${{ steps.rc.outputs.tag }}

      # latest: false keeps candidates from taking the repo's "Latest" badge
      # off the last real release.
      - uses: release-drafter/release-drafter@v6
        with:
          commitish: ${{ github.ref_name }}
          tag: ${{ steps.semantic.outputs.new_tag }}
          name: ${{ steps.semantic.outputs.new_tag }}
          publish: true
          prerelease: true
          prerelease-identifier: rc
          latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Carries each stabilization fix back into develop as it lands, rather than
  # waiting for the promotion to main.
  #
  # A fix merged into a release branch during UAT exists nowhere else. Left
  # here, the next cut from develop reverts it and it returns as a "new" bug.
  # That is not hypothetical: release/v0.1.0 took PRs #19, #20, #22 and #23
  # while in validation, none of which were on develop, and every one had to be
  # hand-carried afterwards.
  #
  # Doing it here rather than at the promotion is what lets deploy-prod.yml
  # skip backpromoting release/** merges: develop is already current by then,
  # so that PR only ever contained merge commits.
  #
  # needs: deploy -- an unvalidated fix should not propagate. The cut itself
  # never reaches this job: GitHub refuses to trigger a workflow from a ref
  # created with GITHUB_TOKEN, so only real merges fire it, and a fresh branch
  # has nothing to carry anyway.
  backpromote:
    needs: deploy
    permissions:
      contents: write
      pull-requests: write
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-backpromote-wfl.yml@v1
    with:
      head-branch: ${{ github.ref_name }}
      base-branch: develop
    secrets: inherit
