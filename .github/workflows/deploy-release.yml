name: Deploy Release Candidate to UAT

# Fires on push to any release/* branch -- the branch itself IS the release
# candidate, not a merge into a fixed staging branch. Creating release/x.y.z
# from develop is the "cut"; every subsequent push (a PR-merged stabilization
# fix) redeploys the same candidate to UAT.
#
# No `paths` filter here on purpose: cutting a release branch is usually a
# pure ref creation with zero new commits over develop, so there's no diff
# for a path filter to match against -- GitHub silently skips the whole
# trigger in that case, not just the path-gated part. The cut itself must
# always deploy, diff or not.

on:
  push:
    branches: ['release/**']

jobs:
  deploy:
    permissions:
      contents: read
      pull-requests: read
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-sf-deploy-wfl.yml@v1
    with:
      environment: uat
      target-org: uat
      # The reusable workflow defaults to RunLocalTests, which means "every
      # test in the org" -- including the 20 stock Communities/Sites sample
      # classes the org ships pre-installed and Active. Those fail with
      # INSUFFICIENT_ACCESS because Communities was never configured, and none
      # of that code is in this repo. Same trap that broke the Integration
      # deploy in PR #13; scope to the deployed metadata instead.
      test-level: RunRelevantTests
    secrets: inherit

  # Publishes the next numbered candidate for this cycle. The cut opens rc.0;
  # every stabilization fix merged into the release branch lands the next one.
  #
  # Numbering rather than mutating is what makes this work at all:
  # release-drafter only ever writes to drafts, so once a candidate is
  # published it is beyond reach -- but publishing the next rc is trivial.
  publish-release-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # github-tag-action runs in a Docker container and shells out to git in
      # the workspace to read existing tags. Without a checkout the workspace
      # is empty and it dies on "fatal: not a git repository" before doing any
      # version math at all. fetch-depth: 0 because a shallow clone carries no
      # tags, which would leave it computing from INITIAL_VERSION instead of
      # from what the repo actually has.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Owns the numbering -- reads the existing git tags and increments the
      # -rc.N suffix. RELEASE_BRANCHES switches between the two shapes:
      # branches matching it get a full version, everything else a candidate.
      # Pointing it at main keeps release/** on candidates and leaves the
      # final version to the prod deploy.
      - name: Bump version and push tag
        id: semantic
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: false
          PRERELEASE: true
          PRERELEASE_SUFFIX: rc
          RELEASE_BRANCHES: main

      # latest: false keeps candidates from taking the repo's "Latest" badge
      # off the last real release.
      - uses: release-drafter/release-drafter@v6
        with:
          commitish: ${{ github.ref_name }}
          tag: ${{ steps.semantic.outputs.new_tag }}
          name: ${{ steps.semantic.outputs.new_tag }}
          publish: true
          prerelease: true
          prerelease-identifier: rc
          latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
