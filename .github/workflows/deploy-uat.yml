name: Deploy to UAT on Merge

on:
  push:
    branches: [staging]
    paths: ['force-app/**']

jobs:
  deploy:
    permissions:
      contents: read
      pull-requests: read
    uses: bes-innovation/gmd-seed-gh-workflow/.github/workflows/gmd-seed-sf-deploy-wfl.yml@v1
    with:
      environment: uat
      target-org: uat
    secrets: inherit

  # Turns the accumulated draft (everything since the last cut) into a real,
  # tagged pre-release the moment it lands in staging -- this is the record
  # of exactly what's being validated in this UAT cycle.
  publish-release-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          commitish: staging
          publish: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
